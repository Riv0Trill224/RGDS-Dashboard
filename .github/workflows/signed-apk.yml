name: Signed test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/build.gradle']

concurrency:
  group: signed-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Signing secrets are never exposed to pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Android ICU regex regression
        run: python3 scripts/check_icu_regex.py
      - name: Linux prototype tests
        run: python3 -m unittest discover -s linux -p 'test_*.py'
      - name: Report relay tests (no email sent)
        run: python3 -m unittest discover -s report-relay
      - name: Cloudflare protocol tests (offline)
        run: node --test cloudflare/worker.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK not found at $sdk_root"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

          # AGP 8.7 uses Build Tools 34.0.0 with compileSdk 35.
          packages=()
          [[ -x "$sdk_root/platform-tools/adb" ]] || packages+=("platform-tools")
          [[ -f "$sdk_root/platforms/android-35/android.jar" ]] || packages+=("platforms;android-35")
          [[ -x "$sdk_root/build-tools/34.0.0/aapt2" && -x "$sdk_root/build-tools/34.0.0/apksigner" ]] || packages+=("build-tools;34.0.0")
          if (( ${#packages[@]} > 0 )); then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager="$(command -v sdkmanager || true)"
            fi
            if [[ ! -x "$sdkmanager" ]]; then
              echo "::error::sdkmanager is not available in the runner SDK or PATH"
              exit 1
            fi
            # Ignore yes's SIGPIPE, but retain sdkmanager's failure status.
            set +o pipefail
            yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
            set -o pipefail
            "$sdkmanager" --sdk_root="$sdk_root" --install "${packages[@]}"
          fi
      - name: Tests and lint
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease
      - name: Restore signing key
        env:
          RGDS_KEYSTORE_BASE64: ${{ secrets.RGDS_KEYSTORE_BASE64 }}
          RGDS_KEYSTORE_PASSWORD: ${{ secrets.RGDS_KEYSTORE_PASSWORD }}
          RGDS_KEY_ALIAS: ${{ secrets.RGDS_KEY_ALIAS }}
          RGDS_KEY_PASSWORD: ${{ secrets.RGDS_KEY_PASSWORD }}
        run: python3 scripts/restore_signing_key.py
      - name: Build signed APK
        env:
          RGDS_KEYSTORE_PATH: ${{ runner.temp }}/rgds-release.jks
          RGDS_KEYSTORE_PASSWORD: ${{ secrets.RGDS_KEYSTORE_PASSWORD }}
          RGDS_KEY_ALIAS: ${{ secrets.RGDS_KEY_ALIAS }}
          RGDS_KEY_PASSWORD: ${{ secrets.RGDS_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature and package artifact
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/rgds-certificate.txt"
          python3 scripts/verify_signing_certificate.py "$RUNNER_TEMP/rgds-certificate.txt"
          mkdir -p dist
          cp "$apk" dist/RGDS-Dashboard.apk
          python3 scripts/release_metadata.py
          tar -czf dist/RGDS-Linux-prototype.tar.gz linux LICENSE
          cd dist
          sha256sum RGDS-Dashboard.apk > SHA256SUMS.txt
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rgds-release.jks" "$RUNNER_TEMP/rgds-certificate.txt"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: RGDS-Dashboard-signed-test-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RGDS-Dashboard-signed-test-${{ github.run_number }}
          path: dist
      - name: Publish public test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(python3 -c 'import json; print(json.load(open("dist/update.json"))["versionName"])')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release already exists. Increase versionCode and versionName; published APKs are not overwritten."
            exit 1
          fi
          gh release create "$tag" dist/RGDS-Dashboard.apk dist/SHA256SUMS.txt dist/update.json dist/RGDS-Linux-prototype.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RGDS Dashboard $tag" \
            --prerelease --notes-file docs/RELEASE_NOTES.md
          mkdir -p verify-release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir verify-release
          for name in RGDS-Dashboard.apk SHA256SUMS.txt update.json RGDS-Linux-prototype.tar.gz; do
            cmp "dist/$name" "verify-release/$name"
          done
