name: Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux prototype tests
        run: python3 -m unittest discover -s linux -p 'test_*.py'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::Android SDK not found at $sdk_root"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

          # AGP 8.7 uses Build Tools 34.0.0 with compileSdk 35.
          packages=()
          [[ -x "$sdk_root/platform-tools/adb" ]] || packages+=("platform-tools")
          [[ -f "$sdk_root/platforms/android-35/android.jar" ]] || packages+=("platforms;android-35")
          [[ -x "$sdk_root/build-tools/34.0.0/aapt2" ]] || packages+=("build-tools;34.0.0")
          if (( ${#packages[@]} > 0 )); then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              sdkmanager="$(command -v sdkmanager || true)"
            fi
            if [[ ! -x "$sdkmanager" ]]; then
              echo "::error::sdkmanager is not available in the runner SDK or PATH"
              exit 1
            fi
            # Ignore yes's SIGPIPE, but retain sdkmanager's failure status.
            set +o pipefail
            yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
            set -o pipefail
            "$sdkmanager" --sdk_root="$sdk_root" --install "${packages[@]}"
          fi
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Tests and lint
        timeout-minutes: 10
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RGDS-Dashboard-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RGDS-Dashboard-debug
          path: RGDS-Dashboard-debug.apk
          if-no-files-found: error
