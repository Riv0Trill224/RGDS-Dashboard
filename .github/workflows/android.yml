name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests, lint and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RGDS-Dashboard-v0.1.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RGDS-Dashboard-v0.1
          path: RGDS-Dashboard-v0.1.apk
          if-no-files-found: error
