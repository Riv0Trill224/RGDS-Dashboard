plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('RGDS_KEYSTORE_PATH')
def updateRepo = providers.gradleProperty('updateRepository').getOrElse('Riv0Trill224/RGDS-Dashboard')
if (!(updateRepo ==~ /[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/)) throw new GradleException('Invalid updateRepository')

android {
    namespace 'com.rgds.dashboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rgds.dashboard'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.0-test4'
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"' + updateRepo + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('RGDS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RGDS_KEY_ALIAS')
                keyPassword System.getenv('RGDS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
